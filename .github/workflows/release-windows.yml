name: Release Windows

on:
  push:
    tags:
      - "windows-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Windows release tag to update
        required: true
        default: "windows-v1.0.2"

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/v2boxkit_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          cache: true
      - name: Fetch pinned Xray and Wintun runtimes
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tool\fetch_windows_runtime.ps1
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Package portable application
        shell: powershell
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP "V2BoxKit-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $artifact
          "ARTIFACT=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $version = $env:RELEASE_TAG.Replace("windows-v", "")
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:ARTIFACT --clobber
            exit 0
          }
          gh release create $env:RELEASE_TAG $env:ARTIFACT `
            --title "V2BoxKit Windows $version" `
            --notes "Windows x64 portable MVP build. Run v2boxkit_client.exe as administrator so Wintun can create the tunnel adapter." `
            --prerelease
