name: Release Windows

on:
  push:
    tags:
      - "windows-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/v2boxkit_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          cache: true
      - name: Fetch pinned Xray and Wintun runtimes
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tool\fetch_windows_runtime.ps1
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Package portable application
        shell: powershell
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP "V2BoxKit-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $artifact
          "ARTIFACT=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.Replace("windows-v", "")
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $env:ARTIFACT --clobber
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME $env:ARTIFACT `
            --title "V2BoxKit Windows $version" `
            --notes "Windows x64 portable MVP build. Run v2boxkit_client.exe and approve the administrator prompt required by Wintun." `
            --prerelease
