name: Release Android

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/v2boxkit_client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          cache: true
      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
      - name: Fetch pinned Xray runtime
        run: ./tool/fetch_android_runtime.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Package release asset
        shell: bash
        run: |
          artifact="${RUNNER_TEMP}/V2BoxKit-${GITHUB_REF_NAME}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${artifact}"
          echo "ARTIFACT=${artifact}" >> "${GITHUB_ENV}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ARTIFACT}" --clobber
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" "${ARTIFACT}" \
            --title "V2BoxKit Android ${GITHUB_REF_NAME#android-v}" \
            --notes "Android MVP build. The APK currently uses the repository debug signing configuration and is intended for testing." \
            --prerelease
