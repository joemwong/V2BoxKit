name: Release iOS source

on:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#ios-v}"
          grep -F "<string>${version}</string>" Config/V2BoxKit-Info.plist
          grep -F "<string>${version}</string>" Config/PacketTunnel-Info.plist
      - name: Package source
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#ios-v}"
          artifact="${RUNNER_TEMP}/V2BoxKit-${GITHUB_REF_NAME}-ios-source.zip"
          git archive --format=zip --prefix="V2BoxKit-${version}/" --output="${artifact}" "${GITHUB_SHA}"
          echo "ARTIFACT=${artifact}" >> "${GITHUB_ENV}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ARTIFACT}" --clobber
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" "${ARTIFACT}" \
            --title "V2BoxKit iOS ${GITHUB_REF_NAME#ios-v}" \
            --notes "iOS/iPadOS source release. A signed IPA is not included because Network Extension distribution requires the publisher Apple Developer certificate and provisioning profiles." \
            --prerelease
